<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard Notes & Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="whiteboard">
        <canvas id="drawingCanvas"></canvas>

        <div id="sidebar">
            <button id="addNote" class="tool-btn" title="Add Note">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
            </button>
            <button id="penToggle" class="tool-btn" title="Pen">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
            </button>
            <div class="eraser-container">
                <button id="eraserToggle" class="tool-btn" title="Eraser / Gum">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20H7L3 16C2.5 15.5 2.5 14.7 3 14.2L13.2 4L20 10.8L12.5 18.3H20V20Z"></path>
                    </svg>
                </button>
                <div id="eraserSettings" class="settings-popup hidden">
                    <label for="eraserSizeRange">Gum Size: <span id="eraserSizeVal">30</span>px</label>
                    <input type="range" id="eraserSizeRange" min="5" max="100" value="30">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
